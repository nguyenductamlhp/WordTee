[package]
name = "wordtee"
version = "0.1.0"
edition = "2024"
description = "Tap the screen to increase a counter - an egui app for desktop and Android"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# `lib` for the binary to link against, `cdylib` for the Android NativeActivity
# to `dlopen`. The lib name decides the `.so` name, which Android looks up via
# the `android.app.lib_name` manifest entry below.
name = "wordtee"
crate-type = ["lib", "cdylib"]

[[bin]]
# Deliberately not called `wordtee`: on wasm32 a same-named bin and cdylib
# would both want to produce `wordtee.wasm`.
name = "wordtee-app"
path = "src/main.rs"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
# The progress file kept in Google Drive, and Google's API responses.
serde_json = "1"
# Query strings and form bodies for Google's sign-in and Drive APIs.
form_urlencoded = "1"
# std::time::SystemTime panics on wasm32; this is the same API that works there.
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Google sign-in and Drive sync on desktop and Android. rustls with Mozilla's
# root certificates rather than the system's TLS, so nothing has to be found on
# the device and there is no OpenSSL to cross-compile for Android.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# The PKCE secret and its SHA-256 challenge for the sign-in (RFC 7636).
getrandom = "0.3"
sha2 = "0.11"
base64 = "0.23"

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "glow",
    "links",
    "wayland",
    "x11",
] }
env_logger = { version = "0.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# No x11/wayland/accesskit/links here: those eframe features are native-only.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "persistence",
    "glow",
    "web_screen_reader",
] }
wasm-bindgen-futures = "0.4"
# Google sign-in in the browser goes through Google's own script, in
# web/index.html; these call it, and `fetch` for the Drive API. Same versions
# as Cargo.lock already holds for eframe: the Dockerfile pins wasm-bindgen-cli
# to match.
wasm-bindgen = "0.2.128"
js-sys = "0.3.105"
# eframe already pulls web-sys in. These turn on `fetch`, for sync, and the
# Notification API, so the reminder setting has somewhere real to deliver.
web-sys = { version = "0.3.105", features = [
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
] }

[target.'cfg(target_os = "android")'.dependencies]
# `android-native-activity` is incompatible with eframe's `accesskit` feature.
eframe = { version = "0.36", default-features = false, features = [
    "android-native-activity",
    "default_fonts",
    "persistence",
    "glow",
    # Opens the browser for Google sign-in (through JNI, by `webbrowser`).
    "links",
] }
android-activity = "0.6"
android_logger = "0.15"
# To ask the window where the system bars cover it. The version android-activity
# itself uses, so the two share one `JavaVM` and Cargo builds jni once.
jni = "0.22"

[dev-dependencies]
# eframe stores state as RON; the progress round-trip test checks that format.
ron = "0.11"
# Reads the bundled font's character map, so a test can prove it covers every
# character the dictionary is able to put on screen.
ttf-parser = "0.25"

[profile.release]
lto = "thin"
strip = true

# ---------------------------------------------------------------------------
# Android packaging, read by `cargo apk2`. See android/README or the project
# README for the full build instructions.
# ---------------------------------------------------------------------------
[package.metadata.android]
package = "com.example.wordtee"
apk_name = "wordtee"
use_aapt2 = true
resources = "android/res"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
# None of our .so files link libc++_shared (checked with `llvm-readelf -d`), so
# there is no need to ship 1.8 MB of C++ runtime per ABI. Flip this to `true` if
# you add a dependency that does.
include_cplusplus_shared = false

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.application]
label = "WordTee"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

# Google sign-in and Drive sync are the app's only network use.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|density|uiMode"
launch_mode = "singleTop"
exported = true

[[package.metadata.android.application.activity.meta_data]]
# Selects `libwordtee.so` from the APK's `lib/<abi>/` directory.
name = "android.app.lib_name"
value = "wordtee"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
