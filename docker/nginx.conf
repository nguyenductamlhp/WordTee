# Serves the WebAssembly demo at / and the APK at /download/, behind a login.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # No nginx version in the `Server` header or on error pages.
    server_tokens off;

    # Every path asks for a login. docker/40-basic-auth.sh writes this file from
    # BASIC_AUTH_USER and BASIC_AUTH_PASSWORD as the container starts; should it
    # be missing, nginx refuses every request rather than serving the site open.
    auth_basic           "WordTee";
    auth_basic_user_file /tmp/htpasswd;

    # A location that sets any header of its own inherits none of these, so
    # every such location below includes the file again.
    include snippets/security-headers.conf;

    # The wasm bundle is a few MB uncompressed and roughly a third of that
    # gzipped, so this is the single biggest win available here.
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/css
                    application/javascript
                    application/json
                    application/wasm
                    image/svg+xml;

    # Trunk fingerprints these filenames, so they are safe to cache forever.
    # `private`, not `public`: these sit behind a login, and `public` would let
    # a shared cache hand them to someone who never logged in.
    location ~* \.(js|css)$ {
        include    snippets/security-headers.conf;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }

    # `WebAssembly.instantiateStreaming` only works if the type is exactly
    # this; nginx's mime.types has covered .wasm since 1.21.5, but saying it
    # here means the demo does not silently fall back to the slow path.
    location ~* \.wasm$ {
        default_type application/wasm;
        include      snippets/security-headers.conf;
        add_header   Cache-Control "private, max-age=31536000, immutable";
    }

    location = /index.html {
        include    snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Rewritten on every deploy; the page reads it to fill in the APK details.
    location = /download/build-info.json {
        default_type application/json;
        include      snippets/security-headers.conf;
        add_header   Cache-Control "no-cache";
    }

    # nginx has no mime type for .apk, and a browser has no business trying to
    # render one.
    location ~ \.apk$ {
        default_type application/vnd.android.package-archive;
        include      snippets/security-headers.conf;
        add_header   Content-Disposition "attachment";
        add_header   Cache-Control "no-cache";
    }

    # For the container's healthcheck, which has no password. Only loopback may
    # ask, so through the proxy it is a 403. It serves the APK metadata, so a
    # 200 still means both build stages produced output.
    location = /healthz {
        auth_basic off;
        allow      127.0.0.1;
        allow      ::1;
        deny       all;
        access_log off;
        try_files  /download/build-info.json =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
