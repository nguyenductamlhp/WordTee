# Serves the WebAssembly demo at / and the APK at /download/.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The wasm bundle is a few MB uncompressed and roughly a third of that
    # gzipped, so this is the single biggest win available here.
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/css
                    application/javascript
                    application/json
                    application/wasm
                    image/svg+xml;

    # Trunk fingerprints these filenames, so they are safe to cache forever.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # `WebAssembly.instantiateStreaming` only works if the type is exactly
    # this; nginx's mime.types has covered .wasm since 1.21.5, but saying it
    # here means the demo does not silently fall back to the slow path.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header   Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rewritten on every deploy; the page reads it to fill in the APK details.
    location = /download/build-info.json {
        default_type application/json;
        add_header   Cache-Control "no-cache";
    }

    # nginx has no mime type for .apk, and a browser has no business trying to
    # render one.
    location ~ \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header   Content-Disposition "attachment";
        add_header   Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
