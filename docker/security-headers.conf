# Included by nginx.conf at server level, and again in each location that adds
# a header of its own. `always` puts them on error responses too, the 401 login
# prompt included.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy        "no-referrer" always;
add_header X-Frame-Options        "DENY" always;

# Only directives that cannot break the app. A policy restricting scripts would
# have to allow the wasm loader and the inline scripts Trunk writes into
# index.html.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
