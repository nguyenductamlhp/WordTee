# Builds the Android APK and the WebAssembly demo, then serves one page that
# offers both: the app running in the browser, and a download link for the APK
# it just built.
#
# Deploy on Coolify
# -----------------
#   + New Resource → your Git repository → Docker Compose
#       Base Directory            /
#       Docker Compose Location   /docker-compose.yml
#
# Coolify clones the repo, runs the build below on the server, and routes its
# own proxy (Traefik or Caddy) to the container.
#
# The site asks for a login: set BASIC_AUTH_USER and BASIC_AUTH_PASSWORD under
# Coolify's Environment Variables. Without both the container will not start.
#
# Run it locally
# --------------
#   docker compose build
#   docker run --rm -p 8080:80 \
#       -e BASIC_AUTH_USER=me -e BASIC_AUTH_PASSWORD=… \
#       wordtee-web                              # http://localhost:8080
#
# and to pull the APK out of the image (as your own user, since the image's
# does not own ./out):
#
#   mkdir -p out && docker run --rm --user "$(id -u)" -v "$PWD/out:/out" \
#       wordtee-web cp /usr/share/nginx/html/download/wordtee.apk /out/
#
# There is deliberately no `ports:` below. Coolify's proxy reaches the container
# over the Docker network, so publishing a host port would bypass it — and
# `coolify-proxy` already binds 80, 443 and 8080, so the obvious choice would
# collide on deploy. Publishing belongs on the `docker run` above, where it is
# a local decision.
#
# Sizing the build: it pulls the Android SDK and NDK (~2.4 GB) and compiles egui
# twice, once for Android and once for WebAssembly. Budget ~10 GB of free disk
# and 4 GB of RAM, and expect the first build to take a while. What ends up
# running afterwards is only nginx plus ~7 MB of static files.

name: wordtee

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      # Fetch the base images afresh, so a redeploy also picks up their
      # security fixes. When the Rust image has changed, that means rebuilding
      # the SDK layer too, as on a first deploy.
      pull: true
      args:
        # arm64 | arm | x86_64 | all
        #
        # On Coolify set this under Environment Variables. Coolify's separate
        # "Build Variables" do not reach Compose builds.
        APK_ABI: ${APK_ABI:-arm64}

    # The login for the whole site; docker/40-basic-auth.sh turns it into
    # nginx's htpasswd file at startup.
    #
    # No `SERVICE_URL_*` here: set the site's address in Coolify's Domains field
    # for this service instead, as `https://apk.example.com:80` — the `:80`
    # suffix names the *container* port, the public site still answers on
    # 80/443.
    #
    # Coolify can also generate a domain from your wildcard domain, via a
    # `SERVICE_URL_WEB_80` variable. If you want that, add it with a trailing
    # equals sign, `- SERVICE_URL_WEB_80=`. The bare form the docs show fails on
    # Git-based Compose apps: Coolify turns the list into a map by splitting
    # each entry on `=`, and an entry with no `=` keeps its list index, emitting
    # `0: SERVICE_URL_WEB_80`, which Compose rejects as a non-string key
    # (coollabsio/coolify#5064).
    environment:
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}

    # Reachable to the proxy on the internal network, not published on the host.
    expose:
      - "80"

    restart: unless-stopped

    # Should nginx ever be exploited, there is little left to take: the
    # filesystem is read-only apart from /tmp, nginx runs as an ordinary user
    # with no capabilities, and nothing in the container can gain any.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Lets that ordinary user listen on port 80. Docker has set this by default
    # since 20.10; spelled out because the container does not start without it.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    mem_limit: 256m
    pids_limit: 256

    healthcheck:
      # Unauthenticated, and answered only from inside the container. It
      # serves the APK metadata, so passing means both build stages produced
      # output.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
